# Makes Changesets name git tags `<package-name>@<version>` instead of `v<version>`
packages:
  - ./
disallowWorkspaceCycles: true

saveExact: true
autoDedupe: true
saveTypes: true
lockfile:
  # Records `autoDedupe`, so that installs don't resolve the lockfile again
  includeResolutionSettings: true
updateConfig:
  ignoreDependencies:
    # Otherwise `pnpm update` replaces the Node.js version range of the
    # runtime with its latest version, and CI fails on older Node.js versions
    - node

minimumReleaseAge: 960 # 16 hours in minutes
minimumReleaseAgeStrict: false # Auto-adds too-new versions to the exclude list instead of prompting or failing
minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude: # []
  - actions-up@2.1.0
  - knip@6.48.0

trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200 # 30 days in minutes
trustPolicyExclude:
  # Published by hand after its release workflow failed. Same code as v2.2.1
  - lefthook@2.2.2
trustPolicyExcludePrune: true

audit:
  ignore: []
  ignorePrune: true

allowBuilds:
  lefthook@2.2.2: true

  esbuild: false
  unrs-resolver: false

dedupePeers: true
strictPeerDependencies: false

peerDependencyRules:
  allowedVersions:
    eslint-plugin-markdown-preferences@0.43.0>@eslint/markdown: '>=7.4.0'
