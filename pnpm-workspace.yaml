# Makes Changesets name git tags `<package-name>@<version>` instead of `v<version>`
packages:
  - ./

saveExact: true
autoDedupe: true
saveTypes: true
lockfile:
  # Records `autoDedupe`, so that installs don't resolve the lockfile again
  includeResolutionSettings: true
updateConfig:
  ignoreDependencies:
    # Otherwise `pnpm update` replaces the Node.js version range of the
    # runtime with its latest version, and CI fails on older Node.js versions
    - node

minimumReleaseAge: 960 # 16 hours in minutes
minimumReleaseAgeStrict: false # Auto-adds too-new versions to the exclude list instead of prompting or failing
minimumReleaseAgeExclude: # []
  - utilery@0.4.0
minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200 # 30 days in minutes
trustPolicyExclude:
  # Published by hand after its release workflow failed. Same code as v2.2.1
  - lefthook@2.2.2

audit:
  ignore: []
  ignorePrune: true

allowBuilds:
  lefthook@2.2.2: true

  esbuild: false
  unrs-resolver: false

dedupePeers: true
strictPeerDependencies: false

peerDependencyRules:
  allowedVersions:
    eslint-config-un@1.0.0-rc.7>eslint-plugin-github-action: '>=0.5.0 && < 1'
