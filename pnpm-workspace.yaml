# Makes Changesets name git tags `<package-name>@<version>` instead of `v<version>`
packages:
  - ./
disallowWorkspaceCycles: true

saveExact: true
autoDedupe: true
saveTypes: true
lockfile:
  # Records `autoDedupe`, so that installs don't resolve the lockfile again
  includeResolutionSettings: true
updateConfig:
  ignoreDependencies:
    # Otherwise `pnpm update` replaces the Node.js version range of the
    # runtime with its latest version, and CI fails on older Node.js versions
    - node

minimumReleaseAge: 960 # 16 hours in minutes
minimumReleaseAgeStrict: false # Auto-adds too-new versions to the exclude list instead of prompting or failing
minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude: # []
  - '@cspell/cspell-bundled-dicts@10.6.0'
  - '@cspell/cspell-json-reporter@10.6.0'
  - '@cspell/cspell-performance-monitor@10.6.0'
  - '@cspell/cspell-pipe@10.6.0'
  - '@cspell/cspell-resolver@10.6.0'
  - '@cspell/cspell-service-bus@10.6.0'
  - '@cspell/cspell-types@10.6.0'
  - '@cspell/cspell-worker@10.6.0'
  - '@cspell/dynamic-import@10.6.0'
  - '@cspell/filetypes@10.6.0'
  - '@cspell/rpc@10.6.0'
  - '@cspell/url@10.6.0'
  - cspell-config-lib@10.6.0
  - cspell-dictionary@10.6.0
  - cspell-gitignore@10.6.0
  - cspell-glob@10.6.0
  - cspell-grammar@10.6.0
  - cspell-io@10.6.0
  - cspell-lib@10.6.0
  - cspell-trie-lib@10.6.0
  - cspell@10.6.0
  - knip@6.49.0

trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200 # 30 days in minutes
trustPolicyExclude: []
trustPolicyExcludePrune: true

audit:
  ignore: []
  ignorePrune: true

allowBuilds:
  lefthook@2.2.4: true

  esbuild: false
  unrs-resolver: false

dedupePeers: true
strictPeerDependencies: false

peerDependencyRules:
  allowedVersions:
    eslint-plugin-markdown-preferences@0.43.0>@eslint/markdown: '>=7.4.0'
