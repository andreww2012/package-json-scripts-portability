# Makes Changesets name git tags `<package-name>@<version>` instead of `v<version>`
packages:
  - ./

saveExact: true
autoDedupe: true
saveTypes: true
lockfile:
  # Records `autoDedupe`, so that installs don't resolve the lockfile again
  includeResolutionSettings: true

minimumReleaseAge: 960 # 16 hours in minutes
minimumReleaseAgeStrict: false # Auto-adds too-new versions to the exclude list instead of prompting or failing
minimumReleaseAgeExclude: # []
  - '@oxfmt/binding-android-arm-eabi@0.77.0'
  - '@oxfmt/binding-android-arm64@0.77.0'
  - '@oxfmt/binding-darwin-arm64@0.77.0'
  - '@oxfmt/binding-darwin-x64@0.77.0'
  - '@oxfmt/binding-freebsd-x64@0.77.0'
  - '@oxfmt/binding-linux-arm-gnueabihf@0.77.0'
  - '@oxfmt/binding-linux-arm-musleabihf@0.77.0'
  - '@oxfmt/binding-linux-arm64-gnu@0.77.0'
  - '@oxfmt/binding-linux-arm64-musl@0.77.0'
  - '@oxfmt/binding-linux-ppc64-gnu@0.77.0'
  - '@oxfmt/binding-linux-riscv64-gnu@0.77.0'
  - '@oxfmt/binding-linux-riscv64-musl@0.77.0'
  - '@oxfmt/binding-linux-s390x-gnu@0.77.0'
  - '@oxfmt/binding-linux-x64-gnu@0.77.0'
  - '@oxfmt/binding-linux-x64-musl@0.77.0'
  - '@oxfmt/binding-openharmony-arm64@0.77.0'
  - '@oxfmt/binding-win32-arm64-msvc@0.77.0'
  - '@oxfmt/binding-win32-ia32-msvc@0.77.0'
  - '@oxfmt/binding-win32-x64-msvc@0.77.0'
  - oxfmt@0.77.0
  - rolldown-plugin-dts@0.30.0
  - tsdown@0.23.7
minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200 # 30 days in minutes
trustPolicyExclude:
  # Published by hand after its release workflow failed. Same code as v2.2.1
  - lefthook@2.2.2

audit:
  ignore: []
  ignorePrune: true

allowBuilds:
  lefthook@2.2.2: true

  esbuild: false
  unrs-resolver: false

dedupePeers: true
strictPeerDependencies: false
